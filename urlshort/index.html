<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener - 빠르고 안전한 무료 링크 단축 서비스</title>
  <meta name="description" content="긴 URL을 짧고 간결한 링크로 즉시 변환하는 무료 URL 단축 서비스. OpenAPI를 연동하여 안전하고 빠른 단축 URL과 원클릭 복사, QR코드 연동을 제공합니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <!-- 마우스 인터랙티브 배경 그라데이션 메시 -->
  <div class="bg-gradient-mesh" id="bgGradientMesh" aria-hidden="true">
    <div class="cursor-glow-follower" id="cursorGlowFollower"></div>
    <div class="glow-sphere glow-1" id="glowSphere1"></div>
    <div class="glow-sphere glow-2" id="glowSphere2"></div>
    <div class="glow-sphere glow-3" id="glowSphere3"></div>
    <div class="glow-sphere glow-4" id="glowSphere4"></div>
  </div>

  <!-- 상단 헤더 (좌측 로고, 중앙 탭 내비게이션, 우측 뱃지) -->
  <header class="app-header" id="appHeader">
    <div class="header-container">
      <a href="index.html" class="brand-logo" id="brandLogo" title="처음으로 돌아가기">
        <img src="img/logo.png" alt="URL Shortener 로고" class="logo-image" id="logoImg">
      </a>
      
      <!-- 기능 전환 네비게이션 탭 (QR코드 <-> URL단축) -->
      <nav class="nav-tab-group" aria-label="메인 서비스 메뉴">
        <a href="../url2qr/index.html" class="nav-tab" id="navQrBtn" title="QR 코드 생성기로 이동">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>QR코드</span>
        </a>
        <a href="index.html" class="nav-tab active" id="navShortBtn" aria-current="page" title="URL 단축 서비스">
          <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-actions">
        <span class="badge-tag">
          <span class="badge-dot"></span>
          <span>SHORTENER</span>
        </span>
      </div>
    </div>
  </header>

  <!-- 메인 스테이지 영역 -->
  <main class="main-stage" id="mainStage">
    
    <!-- 히어로 인트로 섹션 -->
    <div class="hero-intro" id="heroIntro">
      <div class="hero-badge">
        <span class="sparkle-icon">🔗</span>
        <span>간결하고 강력한 링크 단축 솔루션</span>
      </div>
      <h1 class="hero-title">긴 주소를 <span class="highlight-text">단축 URL</span>로 줄여보세요</h1>
      <p class="hero-subtitle">OpenAPI를 통해 간결한 단축 링크를 즉시 생성하고 편리하게 공유하세요.</p>
    </div>

    <!-- URL 입력 폼 카드 섹션 (요구사항 3-1, 3-2, 3-3) -->
    <section class="url-input-section" id="urlInputSection">
      <div class="input-panel-wrapper">
        <form class="url-form" id="urlForm" autocomplete="off" onsubmit="return false;">
          <div class="input-capsule" id="inputCapsule">
            <div class="input-icon-box" aria-hidden="true">
              <svg class="link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </div>
            
            <!-- 요구사항 3-1: URL 입력창 -->
            <input 
              type="url" 
              id="urlInput" 
              class="url-input" 
              placeholder="단축할 긴 URL을 입력하세요 (예: https://example.com/very-long-url)" 
              aria-label="단축할 긴 URL 입력"
              required
              spellcheck="false"
            />

            <!-- 입력 내용 지우기 버튼 -->
            <button type="button" class="clear-input-btn" id="clearInputBtn" aria-label="입력 내용 지우기" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <!-- 요구사항 3-1, 3-2: 단축하기 버튼 (입력 필드가 비어 있으면 disabled) -->
            <button type="submit" class="submit-btn" id="shortenBtn" disabled title="단축할 URL을 입력해주세요">
              <span class="btn-spinner" id="btnSpinner" aria-hidden="true" hidden></span>
              <span class="btn-text" id="btnText">단축하기</span>
              <svg class="submit-arrow-icon" id="btnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>

          <!-- 상태 알림 및 유효성 검사 피드백 메시지 -->
          <div class="form-feedback" id="formFeedback" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <!-- 결과 디스플레이 카드 섹션 (요구사항 3-1, 3-3, 3-4) -->
    <section class="result-section" id="resultSection" aria-live="polite" hidden>
      <div class="result-card-wrapper">
        <div class="result-card" id="resultCard">
          
          <!-- 카드 헤더 -->
          <div class="result-card-header">
            <div class="result-status-badge">
              <span class="status-dot"></span>
              <span>단축 완료</span>
            </div>
            <span class="api-service-tag">OpenAPI via is.gd</span>
          </div>

          <!-- 원본 URL 정보 미리보기 -->
          <div class="original-url-box">
            <span class="box-label">원본 URL</span>
            <p class="original-url-text" id="originalUrlText">-</p>
          </div>

          <!-- 요구사항 3-1: 읽기 전용 출력 상자 & 복사 버튼 그룹 -->
          <div class="short-url-container">
            <label for="resultUrlInput" class="box-label">단축된 URL</label>
            <div class="result-input-group">
              <div class="readonly-input-wrapper">
                <svg class="link-result-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <!-- 요구사항 3-1, 3-3: 읽기 전용 출력 상자 -->
                <input 
                  type="text" 
                  id="resultUrlInput" 
                  class="result-url-input" 
                  readonly 
                  placeholder="단축된 URL이 여기에 표시됩니다"
                  aria-label="단축된 URL 결과 (읽기 전용)"
                />
                <span class="readonly-badge">읽기 전용</span>
              </div>

              <!-- 요구사항 3-4: 복사 버튼 (클릭 시 자동 복사 및 '복사하였습니다' 알림) -->
              <button type="button" class="action-btn copy-btn" id="copyBtn" title="단축 URL 클립보드 복사">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>복사</span>
              </button>
            </div>
          </div>

          <!-- 부가 편의 기능 액션 버튼들 -->
          <div class="secondary-actions-row">
            <!-- 단축 URL 새 창 열기 -->
            <a href="#" target="_blank" rel="noopener noreferrer" class="sub-action-btn" id="openLinkBtn" title="단축된 URL을 새 탭에서 열어 테스트">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>링크 열기</span>
            </a>

            <!-- 이 단축 URL로 QR 코드 생성하기 연계 -->
            <button type="button" class="sub-action-btn qr-link-btn" id="makeQrBtn" title="이 단축 URL로 QR 코드를 생성합니다">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span>QR코드 만들기</span>
            </button>
          </div>

        </div>
      </div>
    </section>

    <!-- 최근 단축 기록 섹션 -->
    <section class="history-section" id="historySection">
      <div class="history-panel">
        <div class="history-header">
          <div class="history-title-box">
            <svg class="history-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h2>최근 단축 내역</h2>
            <span class="history-count" id="historyCount">0</span>
          </div>
          <button type="button" class="clear-history-btn" id="clearHistoryBtn" title="내역 모두 지우기" hidden>
            <span>전체 삭제</span>
          </button>
        </div>
        
        <div class="history-list" id="historyList">
          <div class="empty-history" id="emptyHistory">
            <p>아직 생성된 단축 URL이 없습니다. 긴 URL을 입력해 보세요!</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <!-- JavaScript 모듈 로드 -->
  <script src="app.js"></script>
</body>
</html>
